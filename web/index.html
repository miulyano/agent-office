<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* палитра офиса: те же имена и в окошке строки меню (menubar.html) */
  :root {
    --bg: #14151f; --panel: #1c1d2b; --line: #2a2c40; --text: #e8e6f0; --muted: #8a8fb0; --gold: #f0c040; --ok: #4ade80; --off: #e05a5a;
    --floor: #2e3150; --wall: #191a29; --plate: #f4f1e8; --ink: #1d1f2e; --rim: #44486a;
    --claude: #e08a5b; --codex: #4fb3c8;
    --gap: 16px; --px: 2px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, Helvetica, sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) min(var(--side, 340px), calc(100vw - 560px)); grid-template-rows: auto 1fr; height: 100vh; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--wall); }
  ::-webkit-scrollbar-thumb { background: var(--floor); border: 2px solid var(--wall); }

  /* пиксельная рамка: ступенька в углах, как у табличек на этажах */
  .pix, button, .seg, .sess, .err { box-shadow: 0 calc(-1 * var(--px)) 0 0 var(--c, var(--rim)), 0 var(--px) 0 0 var(--c, var(--rim)), calc(-1 * var(--px)) 0 0 0 var(--c, var(--rim)), var(--px) 0 0 0 var(--c, var(--rim)); }

  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px var(--gap); background: var(--wall); border-bottom: var(--px) solid var(--line); }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
  header .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  header .plate { flex: none; padding: 2px 7px; color: var(--ink); font: 700 11px Menlo, monospace; letter-spacing: .06em; background: var(--pc); }
  header .plate:empty { display: none; }
  .p-claude { --pc: var(--claude); }
  .p-codex { --pc: var(--codex); }
  header .title { min-width: 0; font-weight: 700; letter-spacing: .04em; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .status { min-width: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .spacer { flex: 1; }
  header button { flex: none; padding: 4px 10px; }
  #shot { display: inline-flex; align-items: center; gap: 6px; }
  header .total { font: 700 15px Menlo, monospace; color: var(--gold); }
  .sess .m .usd, .sess .m .fon { color: var(--gold); font-family: Menlo, monospace; }

  button { --c: var(--rim); background: var(--floor); color: var(--text); border: 0; border-radius: 0; padding: 5px 12px; margin: var(--px); font: 600 12px -apple-system, Helvetica, sans-serif; letter-spacing: .03em; cursor: pointer; }
  button:hover { background: #3a3e63; }
  button:active { transform: translateY(1px); }
  button.main { --c: #a07d1c; background: var(--gold); color: var(--ink); }
  button.main:hover { background: #ffd35a; }
  button.warn { --c: #a03838; background: var(--off); color: #fff; }
  button:disabled { opacity: .55; cursor: default; transform: none; }

  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px var(--gap); padding: 12px var(--gap) 0; color: var(--muted); font-size: 12px; }
  /* подсказка о генерации — своей строкой под переключателями; пустая не занимает места */
  .bar .note { flex: 1 1 100%; min-width: 0; color: var(--text); }
  .bar .note:empty { display: none; }
  .bar .note b.bad { color: var(--off); }
  .bar .note b.good { color: var(--ok); }
  .bar .note .dim { opacity: .6; }
  .bar .note button.mini { padding: 1px 7px; margin: 0 4px; font-size: 11px; }
  .spin { display: inline-block; width: 8px; height: 8px; margin-right: 7px; background: var(--gold); animation: blink .6s steps(2, jump-none) infinite; }
  .bar .k { font: 600 11px Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; margin-right: 6px; }
  .bar .group { display: flex; flex-wrap: wrap; align-items: center; min-width: 0; }

  /* переключатель-табличка вместо системного списка */
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--wall); margin: var(--px); }
  .seg button { box-shadow: none; margin: 0; background: transparent; color: var(--muted); font-weight: 500; padding: 4px 10px; }
  .seg button:hover { color: var(--text); background: var(--panel); }
  .seg button.on { background: var(--plate); color: var(--ink); font-weight: 700; }

  #office { flex: 1; overflow: auto; padding: var(--gap); min-height: 0; min-width: 0; }
  .stage { position: relative; width: 100%; --c: var(--line); }
  .stage canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  /* вспышка камеры: видно, что кадр снят */
  .stage.flash::after { content: ''; position: absolute; inset: 0; background: #fff; pointer-events: none; animation: flash .35s steps(4, end) forwards; }
  @keyframes flash { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .stage.flash::after { display: none; } }
  .stage canvas.labels { position: absolute; inset: 0; height: 100%; pointer-events: none; image-rendering: auto; }
  .err { --c: var(--off); margin: 12px var(--gap) 0; padding: 8px 12px; background: #2a1820; color: #ffb0b0; font: 12px Menlo, monospace; white-space: pre-wrap; }

  aside { position: relative; border-left: var(--px) solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; overflow-wrap: anywhere; }
  /* ручка ширины колонки: лежит на левой границе, при наведении граница золотая */
  .grip { position: absolute; left: calc(-1 * var(--px)); top: 0; bottom: 0; width: 8px; z-index: 1; cursor: col-resize; touch-action: none; outline: none; }
  .grip::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: var(--px); }
  /* разделитель сессий и журнала: лежит на границе между ними */
  .split { position: relative; flex: none; height: 0; z-index: 1; cursor: row-resize; touch-action: none; outline: none; }
  .split::before { content: ''; position: absolute; left: 0; right: 0; top: -7px; height: 8px; }
  .split::after { content: ''; position: absolute; left: 0; right: 0; top: calc(-1 * var(--px)); height: var(--px); }
  .grip:hover::after, .grip:focus-visible::after, .grip.drag::after, .split:hover::after, .split:focus-visible::after, .split.drag::after { background: var(--gold); }
  aside details { padding: 0 var(--gap) 14px; overflow: auto; }
  /* пока разделитель не трогали, высоту задаёт список, но не больше 45% */
  aside .sessions { height: var(--split, auto); max-height: var(--split, 45%); border-bottom: var(--px) solid var(--line); flex: none; }
  aside .log { flex: 1; min-height: 0; }
  /* свёрнутая часть — полоска, вторая забирает всю высоту; разделять нечего. Обе разом не сворачиваются */
  aside .log:not([open]) { flex: none; }
  aside:has(.log:not([open])) .sessions { height: auto; max-height: none; flex: 1; }
  aside .sessions.fold:not([open]) { height: auto; max-height: none; flex: none; }
  aside:has(.fold:not([open])) .split { display: none; }
  /* кликается вся полоска, а не только слово в заголовке; при прокрутке заголовок остаётся наверху */
  .fold summary { position: sticky; top: 0; z-index: 1; background: var(--panel); list-style: none; cursor: pointer; margin: 0 calc(-1 * var(--gap)); padding: 10px var(--gap) 8px; }
  .fold:not([open]) summary { margin-bottom: -14px; padding-bottom: 10px; }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary h2 { flex-wrap: wrap; margin: 0; overflow-wrap: normal; justify-content: flex-start; gap: 0 6px; }
  .fold summary h2::before { content: '▾'; }
  .fold:not([open]) summary h2::before { content: '▸'; }
  .fold summary:hover h2 { color: var(--text); }
  aside h2 { margin: 0 0 10px; font: 600 11px Menlo, monospace; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }

  .sess { --c: transparent; position: relative; display: block; width: calc(100% - 2 * var(--px)); text-align: left; margin: var(--px) var(--px) 6px; padding: 6px 10px 6px 14px; background: var(--bg); font: inherit; letter-spacing: 0; }
  .sess::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pc); }
  /* фильтр провайдера в строке заголовка: каждый своим цветом */
  .seg.prov { display: flex; flex: none; flex-wrap: nowrap; gap: 8px; margin: 0 0 0 auto; background: none; box-shadow: none; }
  .seg.prov button { padding: 2px 1px 3px; color: var(--pc, var(--muted)); opacity: .75; font: 500 11px Menlo, monospace; letter-spacing: 0; }
  .seg.prov button:hover { background: none; opacity: 1; }
  .seg.prov button.on { background: none; color: var(--pc, var(--text)); opacity: 1; font-weight: 600; box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--pc, var(--gold)); }
  .sess:hover { background: var(--floor); }
  .sess.sel { --c: var(--gold); background: var(--floor); }
  .sess .t { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  /* сессия, порождённая другой: под родителем, со сдвигом */
  .sess.kid { width: calc(100% - 2 * var(--px) - 14px); margin-left: calc(var(--px) + 14px); }
  .sess .br { color: var(--pc); opacity: .8; font-family: Menlo, monospace; font-size: 10px; }
  .sess .t span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess.pin .t::after { content: 'закреплена'; flex: none; margin-left: auto; color: var(--gold); font: 500 10px Menlo, monospace; }
  .sess .m { color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 2px; padding-left: 16px; }
  .sess .d { width: 8px; height: 8px; border-radius: 50%; background: #4a4d68; flex: none; }
  .sess .d.live { background: var(--ok); }
  .sess .d.busy { background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: blink 1.2s steps(2, jump-none) infinite; }
  @keyframes blink { 100% { opacity: .3; box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { .sess .d.busy { animation: none; } }
  .line { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .line time { color: var(--muted); font-family: Menlo, monospace; font-size: 12px; margin-right: 6px; }
  .line b { color: var(--gold); font-weight: 600; }
  .empty { color: var(--muted); }
  @media (max-width: 900px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; height: auto; }
    /* шапка в две строки: название, потом статус, кнопки и сумма */
    header { flex-wrap: wrap; row-gap: 6px; }
    header .title { flex: 1 1 60%; }
    aside { border-left: 0; border-top: var(--px) solid var(--line); }
    .grip, .split { display: none; }
    aside .sessions { height: auto; max-height: none; }
    /* колонка крутится вместе со страницей: своя прокрутка отвязала бы заголовки от неё */
    aside details { overflow: visible; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span class="plate" id="plate"></span>
  <span class="title" id="title">Agent Office</span>
  <span class="status" id="status">подключаюсь…</span>
  <span class="spacer"></span>
  <button id="shot" title="Скриншот этого офиса: в ~/Pictures/Agent Office и в буфер обмена"><svg viewBox="0 0 14 11" width="18" height="14" fill="currentColor" fill-rule="evenodd" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 2h4V0h6v2h4v9H0zM5 4h4v1h1v3H9v1H5V8H4V5h1zM6 6h2v1H6zM11 3h1v1h-1z"/></svg><span id="shotText">Скриншот</span></button>
  <button id="gen" hidden>Сгенерировать офис</button>
  <span class="total" id="total"></span>
</header>
<main>
  <div class="bar">
    <span class="group"><span class="k">Офис</span><span class="seg" id="officeStyle"></span></span>
    <span class="group"><span class="k">Время</span><span class="seg" id="timeOfDay"></span></span>
    <span class="note" id="bannerText"></span>
    <span class="note" id="shotNote"></span>
  </div>
  <div class="err" id="err" hidden></div>
  <div id="office"><div class="stage">
    <canvas id="scene" width="320" height="240" aria-label="Офис агентов по этажам"></canvas>
    <canvas id="labels" class="labels" aria-hidden="true"></canvas>
  </div></div>
</main>
<aside>
  <div class="grip" id="grip" role="separator" aria-orientation="vertical" aria-label="Ширина колонки" aria-valuemin="260" aria-valuemax="720" aria-valuenow="340" tabindex="0" title="Потяни, чтобы изменить ширину. Двойной клик вернёт обычную"></div>
  <details class="sessions fold" id="sessionsPanel" open>
    <summary><h2>СЕССИИ <span class="seg prov" id="prov"></span></h2></summary>
    <div id="sessions"><div class="empty">Ищу сессии…</div></div>
  </details>
  <div class="split" id="split" role="separator" aria-orientation="horizontal" aria-label="Высота сессий" aria-valuenow="45" tabindex="0" title="Потяни, чтобы поделить колонку между сессиями и журналом. Двойной клик вернёт как было"></div>
  <details class="log fold" id="logPanel" open>
    <summary><h2>ЖУРНАЛ</h2></summary>
    <div id="log"><div class="empty">Пока тихо.</div></div>
  </details>
</aside>
<script type="module">
// метка в адресе: после правок office.js браузер не держит старый модуль
const { roleName, money, span, workedNow } = await import('./office.js?' + Date.now())
const { mountFloors, OFFICES, TIME_OPTIONS } = await import('./floors.js?' + Date.now())
const { funnyName, pngOf } = await import('./shot.js?' + Date.now())

const $ = id => document.getElementById(id)
const logBox = $('log'), dot = $('dot'), status = $('status')
const titleEl = $('title'), list = $('sessions'), total = $('total'), plate = $('plate'), provBox = $('prov')
const PROVIDERS = { all: 'Все', claude: 'Claude', codex: 'Codex' }

let sessions = []
let current = location.hash.slice(1)   // закреплённая сессия живёт в адресе
let auto = !current   // офис сам идёт за активной сессией, пока её не выбрали в списке
let live = null, lastText = '', lastDraw = 0
let provider = 'all'
try { provider = localStorage.getItem('office.provider') || 'all' } catch {}
if (!(provider in PROVIDERS)) provider = 'all'

function save(key, value) { try { localStorage.setItem(key, value) } catch {} }

// правая колонка: ручки тянут мышью или стрелками, двойной клик возвращает как было
const grip = $('grip'), split = $('split'), aside = grip.parentElement, SIDE = 340, PANE = 96
function handle(el, at, keys, now, set, reset, keep) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault()
    el.setPointerCapture(e.pointerId)
    el.classList.add('drag')
  })
  el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) set(at(e)) })
  el.addEventListener('lostpointercapture', () => { el.classList.remove('drag'); keep() })
  el.addEventListener('dblclick', () => { reset(); keep() })
  el.addEventListener('keydown', e => {
    if (!keys[e.key]) return
    e.preventDefault()
    set(now() + keys[e.key])
    keep()
  })
}
// офису остаётся не меньше 560 точек. Окно ограничивает только показ: в широком вернётся выбранная ширина
let side = SIDE
const tellSide = () => grip.setAttribute('aria-valuenow', Math.max(260, Math.min(side, innerWidth - 560)))
function setSide(w) {
  side = Math.round(Math.max(260, Math.min(w, 720)))
  document.body.style.setProperty('--side', side + 'px')
  tellSide()
}
try { setSide(Number(localStorage.getItem('office.side')) || SIDE) } catch {}
handle(grip, e => Math.min(innerWidth - e.clientX, innerWidth - 560), { ArrowLeft: 16, ArrowRight: -16 }, () => aside.offsetWidth, setSide, () => setSide(SIDE), () => save('office.side', side))
addEventListener('resize', tellSide)
// доля сессий в высоте колонки в процентах, 0 — разделитель не трогали. Окно ограничивает только показ: каждой части не меньше PANE точек
let share = 0
function showShare() {
  const h = aside.clientHeight, lim = h >= 2 * PANE ? PANE / h * 100 : 0
  const shown = share && Math.max(lim, Math.min(share, 100 - lim))
  if (shown) aside.style.setProperty('--split', shown + '%')
  else aside.style.removeProperty('--split')
  split.setAttribute('aria-valuenow', Math.round(shown || 45))
}
function setShare(p) {
  share = Math.round(p * 10) / 10
  showShare()
}
addEventListener('resize', showShare)
const setSplit = h => setShare(Math.max(PANE, Math.min(h, aside.clientHeight - PANE)) / aside.clientHeight * 100)
try { setShare(Number(localStorage.getItem('office.split')) || 0) } catch {}
handle(split, e => e.clientY - aside.getBoundingClientRect().top, { ArrowUp: -24, ArrowDown: 24 }, () => split.previousElementSibling.offsetHeight, setSplit, () => setShare(0), () => save('office.split', share))
// свёрнутая часть остаётся свёрнутой после перезагрузки; обе разом не сворачиваются: вторая раскрывает первую
const panels = [[$('sessionsPanel'), 'office.sessions'], [$('logPanel'), 'office.log']]
for (const [panel, key] of panels) {
  try { if (localStorage.getItem(key) === '0') panel.open = false } catch {}
  panel.addEventListener('toggle', () => {
    save(key, panel.open ? '1' : '0')
    const other = panels.find(([p]) => p !== panel)[0]
    if (!panel.open && !other.open) other.open = true
  })
}

const who = w => roleName(w, live?.office)
const shown = () => sessions.filter(s => provider === 'all' || s.provider === provider)
const bannerText = $('bannerText'), gen = $('gen')
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const hhmm = at => new Date(at).toTimeString().slice(0, 5)

function ago(at) {
  const m = Math.round((Date.now() - at) / 60000)
  if (m < 1) return 'только что'
  if (m < 60) return m + ' мин назад'
  return Math.floor(m / 60) + ' ч назад'
}

// этажи рисуются сами каждый кадр; сюда приходят только свежие данные
const errBox = $('err')
const floors = mountFloors($('scene'), $('labels'), e => {
  const msg = 'Офис не нарисовался: ' + (e?.stack || e)
  if (errBox.textContent !== msg) { errBox.textContent = msg; errBox.hidden = false }
})
// переключатели-таблички вместо системных списков
function segment(box, options, key, fallback, titles = {}) {
  let value = fallback
  try { value = localStorage.getItem(key) || fallback } catch {}
  if (!(value in options)) value = fallback
  box.innerHTML = Object.entries(options).map(([k, name]) =>
    `<button data-k="${k}"${titles[k] ? ` title="${esc(titles[k])}"` : ''}>${esc(name)}</button>`).join('')
  const mark = () => box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === value))
  box.addEventListener('click', e => {
    const b = e.target.closest('button')
    if (!b || b.dataset.k === value) return
    value = b.dataset.k
    save(key, value)
    mark()
    restyle()
  })
  mark()
  return { get value() { return value } }
}
const styleSel = segment($('officeStyle'), Object.fromEntries(Object.entries(OFFICES).map(([k, o]) => [k, o.name])), 'office.style', 'cozy',
  Object.fromEntries(Object.entries(OFFICES).map(([k, o]) => [k, o.ref])))
const timeSel = segment($('timeOfDay'), TIME_OPTIONS, 'office.time', 'clock')
function restyle() {
  floors.setStyle(styleSel.value, timeSel.value)
}
restyle()

function draw(st) {
  floors.update(st)
  drawBanner(st.office)
  lastDraw = Date.now()
  const lines = st.log.slice(-80).reverse()
  logBox.innerHTML = lines.length === 0
    ? '<div class="empty">Пока тихо.</div>'
    : lines.map(l => `<div class="line"><time>${new Date(l.at).toTimeString().slice(0, 8)}</time><b>${esc(who(l.who))}</b> · ${esc(l.text)}</div>`).join('')
}

function drawProviders() {
  const html = Object.entries(PROVIDERS).map(([k, name]) =>
    `<button data-k="${k}" class="p-${k}${k === provider ? ' on' : ''}">${name}</button>`).join('')
  if (html !== provBox.dataset.html) {
    provBox.dataset.html = html
    provBox.innerHTML = html
  }
}

// дети задачи идут сразу за своим корнем; корень без детей — обычная строка
function nested(rows) {
  const ids = new Set(rows.map(s => s.id))
  const roots = rows.filter(s => !s.task || s.task === s.id || !ids.has(s.task))
  return roots.flatMap(r => [r, ...rows.filter(s => s !== r && s.task === r.id).map(s => ({ ...s, kid: true }))])
}

function drawList() {
  drawProviders()
  const rows = nested(shown())
  if (rows.length === 0) {
    delete list.dataset.html
    list.innerHTML = `<div class="empty">За сутки сессий${provider === 'all' ? '' : ' ' + PROVIDERS[provider]} не было.</div>`
    return
  }
  const html = rows.map(s => {
    const cls = s.working ? 'busy' : s.isLive ? 'live' : ''
    const work = s.working ? `в работе ${s.working}` : ago(s.at)
    const agents = s.agents ? ` · агентов ${s.agents}` : ''
    const usd = s.cost ? ` · <span class="usd">${money(s.cost)}</span>` : ''
    const fon = s.shells ? ` · <span class="fon">фон ${s.shells}</span>` : ''
    // минуты, а не секунды: строка меняется редко, и клик не попадает в заменённую кнопку
    const worked = workedNow(s, Date.now()), time = worked >= 60000 ? ` · ${span(worked)}` : ''
    const branch = s.kid && s.branch ? ` · <span class="br">${esc(s.branch)}</span>` : ''
    return `<button class="sess p-${s.provider}${s.id === current ? ' sel' : ''}${s.id === current && !auto ? ' pin' : ''}${s.kid ? ' kid' : ''}" data-id="${s.id}"${s.id === current && !auto ? ' title="Клик вернёт слежение за активной сессией"' : ''}>
      <div class="t"><span class="d ${cls}"></span><span>${s.kid ? '↳ ' : ''}${esc(s.title)}</span></div>
      <div class="m">${esc(s.project)}${branch} · ${work}${time}${agents}${fon}${usd}</div></button>`
  }).join('')
  // не трогать список без перемен: иначе клик попадает в уже заменённую кнопку
  if (html !== list.dataset.html) {
    list.dataset.html = html
    list.innerHTML = html
  }
}

list.addEventListener('click', e => {
  const b = e.target.closest('.sess')
  if (!b) return
  // клик закрепляет сессию, повторный по закреплённой снова отдаёт выбор офису
  auto = !auto && b.dataset.id === current
  auto ? autoPick() : pick(b.dataset.id)
})

provBox.addEventListener('click', e => {
  const b = e.target.closest('button')
  if (!b) return
  provider = b.dataset.k
  save('office.provider', provider)
  drawList()
  if (auto) autoPick()
})

function pick(id) {
  history.replaceState(null, '', auto ? location.pathname + location.search : '#' + id)
  if (id === current) return drawList()
  current = id
  lastText = ''
  floors.reset()
  drawList()
  pollState()
}

// самая активная: где больше всего работают, потом — где писали последней
function autoPick() {
  const best = shown().sort((a, b) => (b.working - a.working) || (b.at - a.at))[0]
  if (best) pick(best.id)
}

async function pollSessions() {
  try {
    const res = await fetch('api/sessions', { cache: 'no-store' })
    if (!res.ok) throw new Error(res.status)
    sessions = await res.json()
    dot.classList.add('on')
    if (!sessions.some(s => s.id === current)) auto = true
    if (auto) autoPick()
    drawList()
  } catch {
    dot.classList.remove('on')
    status.textContent = 'сервер офиса не отвечает'
  }
}

// Генерация офиса идёт на сервере в фоне: здесь только её состояние и кнопки.
// Пересобрать можно сразу — прежний офис сервер сохраняет, его можно вернуть.
const clockOf = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }
const RECENT = 15 * 60e3   // итог генерации висит столько, пока его не закрыли
const STAGES = { queue: 'жду, пока соберётся другой офис', start: 'запускаю claude', answer: 'claude раздаёт должности и столы' }
let ticking = 0

function seenKey(o) { return 'office.seen.' + o.folder }
function seen(o) { try { return Number(localStorage.getItem(seenKey(o)) || 0) } catch { return 0 } }

function drawBanner(o) {
  const job = o.job
  gen.hidden = !o.folder || o.folder === '?' || o.provider === 'codex'
  if (gen.hidden) { bannerText.textContent = ''; return }
  const place = o.folder.replace(/^\/Users\/[^/]+/, '~')
  const running = job?.status === 'running'
  clearInterval(ticking)
  if (running) ticking = setInterval(() => drawBanner(o), 1000)
  gen.disabled = false
  gen.classList.toggle('warn', running)
  gen.classList.toggle('main', !running && (!o.saved || job?.status === 'failed'))
  gen.dataset.act = running ? 'cancel' : 'start'
  gen.textContent = running ? 'Отменить' : job?.status === 'failed' ? 'Повторить' : o.saved ? 'Пересобрать офис' : 'Сгенерировать офис'
  const fresh = job && job.ended && Date.now() - job.ended < RECENT && job.ended > seen(o)
  const close = '<button class="mini" data-act="seen" title="Скрыть">×</button>'
  let html = ''
  if (running) {
    html = `<span class="spin"></span>Собираю офис для ${esc(place)}: ${STAGES[job.stage] ?? STAGES.answer} · ${clockOf(Date.now() - job.started)} <span class="dim">из ${clockOf(job.timeout * 1000)}</span>`
  } else if (fresh && job.status === 'failed') {
    html = `<b class="bad">Не собралось.</b> ${esc(job.error)}. Офис остался прежним. ${close}`
  } else if (fresh && job.status === 'cancelled') {
    html = `Отменено, офис остался прежним. ${close}`
  } else if (fresh && job.status === 'done') {
    const sum = job.summary ?? {}
    const did = [sum.moved && `пересели: ${sum.moved}`, sum.renamed && `новые должности: ${sum.renamed}`, sum.added && `новые столы: ${sum.added}`].filter(Boolean).join(', ')
    html = (job.mode === 'add' ? `<b class="good">В штате пополнение:</b> ${esc(job.added.join(', '))}.` : `<b class="good">Офис пересобран</b> за ${clockOf(job.ended - job.started)}${did ? ': ' + did : ', всё осталось на местах'}.`) +
      (job.canUndo ? ' <button class="mini" data-act="undo">Вернуть прежний</button>' : '') + ` ${close}`
  } else if (fresh && job.status === 'undone') {
    html = `Вернул прежний офис. ${close}`
  } else if (o.hidden) {
    html = `<span class="dim">Эта сессия видит не весь штат: столов вне её состава — ${o.hidden}.</span>`
  } else if (!o.saved) {
    html = `Для ${esc(place)} офиса ещё нет: столы расставлены по плагинам, должности из названий агентов.`
  }
  if (bannerText.innerHTML !== html) bannerText.innerHTML = html
}

function fail(text) {
  errBox.textContent = text
  errBox.hidden = false
  setTimeout(() => { if (errBox.textContent === text) errBox.hidden = true }, 8000)
}

async function act(what) {
  if (!live) return
  if (what === 'seen') {
    save(seenKey(live.office), String(Date.now()))
    return drawBanner(live.office)
  }
  const path = { start: 'api/office', cancel: 'api/office/cancel', undo: 'api/office/undo' }[what]
  gen.disabled = true
  try {
    const res = await fetch(path + '?s=' + encodeURIComponent(current), { method: 'POST' })
    const body = await res.json()
    if (!res.ok) fail(body.error ?? res.status)
    else { live.office.job = body; if (what === 'start') save(seenKey(live.office), '0') }
  } catch (e) {
    fail('Сервер офиса не ответил: ' + e)
  }
  drawBanner(live.office)
  lastText = ''
  pollState()
}
gen.addEventListener('click', () => act(gen.dataset.act || 'start'))
bannerText.addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b) act(b.dataset.act) })

// Скриншот: только здание открытого офиса, этот самый кадр; смешное название — в имени файла
const shotBtn = $('shot'), shotText = $('shotText'), shotNote = $('shotNote'), stage = document.querySelector('.stage')
let shotTimer = 0

// Папку держит сервер; не вышло — обычное скачивание браузером, картинка не теряется
async function keepShot(png, name) {
  try {
    const res = await fetch('api/shot?name=' + encodeURIComponent(name), { method: 'POST', headers: { 'Content-Type': 'image/png' }, body: png })
    if (res.ok) return (await res.json()).path
  } catch {}
  const a = document.createElement('a')
  a.href = URL.createObjectURL(png)
  a.download = name + '.png'
  a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 60000)
  return ''
}

shotBtn.addEventListener('click', async () => {
  if (!live || !current) return fail('Снимать нечего: сессия ещё не открылась')
  shotBtn.disabled = true
  shotText.textContent = 'Снимаю…'
  stage.classList.remove('flash'); void stage.offsetWidth; stage.classList.add('flash')
  const working = live.agents.filter(a => a.isWorking).length + (live.producer.isBusy ? 1 : 0)
  const name = funnyName(working)
  const png = pngOf(floors.picture())
  // буфер обмена отдаётся только прямо в обработчике клика, поэтому картинка идёт туда ещё обещанием
  let copied = Promise.resolve(false)
  try { copied = navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]).then(() => true, () => false) } catch {}
  try {
    const path = await keepShot(await png, name)
    const where = path ? esc(path.replace(/^\/Users\/[^/]+/, '~')) : 'в папку не записалось, скачал браузером'
    // браузер может не ответить на запись в буфер вовсе: файл уже лежит, кнопка не должна ждать
    const inClipboard = await Promise.race([copied, new Promise(ok => setTimeout(ok, 1500, false))])
    shotNote.innerHTML = `<b class="good">Скриншот «${esc(name)}»:</b> ${where}${inClipboard ? ' · в буфере обмена' : ''}`
    clearTimeout(shotTimer)
    shotTimer = setTimeout(() => { shotNote.textContent = '' }, 15000)
  } catch (e) {
    fail('Скриншот не получился: ' + (e?.message ?? e))
  }
  shotText.textContent = 'Скриншот'
  shotBtn.disabled = false
})

async function pollState() {
  if (!current) return
  try {
    const id = current
    const res = await fetch('api/state?s=' + encodeURIComponent(id), { cache: 'no-store' })
    if (!res.ok || id !== current) return
    const text = await res.text()
    if (text !== lastText) {
      lastText = text
      live = JSON.parse(text)
      draw(live)
    } else if (Date.now() - lastDraw > 30000) {
      draw(live)
    }
    const s = sessions.find(s => s.id === current)
    // у корня задачи в офисе вся задача, у порождённой сессии только своё: имя берём у первого руководителя
    const heads = live.sessions ?? [], title = heads[0]?.title ?? s?.title
    plate.className = 'plate p-' + s?.provider
    plate.textContent = s ? PROVIDERS[s.provider].toUpperCase() : ''
    titleEl.textContent = title ?? 'Agent Office'
    document.title = title ? `Agent Office — ${title}` : 'Agent Office'
    const working = live.agents.filter(a => a.isWorking).length + (heads.length ? heads.filter(h => h.isBusy).length : (live.producer.isBusy ? 1 : 0))
    total.textContent = money(live.cost)
    total.title = `${roleName('main', live.office)} ${money(live.producer.cost)}, агенты ${money(live.cost - live.producer.cost)}`
    const worked = workedNow(live, Date.now()), time = worked ? ` · время ${span(worked)}` : ''
    status.textContent = !s ? '' : (s.isLive ? `${s.project} · в работе ${working}` : `${s.project} · последняя активность ${ago(s.at)}`) + time
  } catch {}
}

function empty() {
  return { agents: [], producer: { isBusy: false, activity: '', at: 0, calls: 0, cost: 0, model: '', tool: '' }, sessions: [], cost: 0, log: [], since: Date.now(),
    office: { folder: '', title: 'AGENT OFFICE', zones: [], guests: {}, saved: true } }
}

draw(empty())
await pollSessions()
pollState()
setInterval(pollSessions, 4000)
setInterval(pollState, 1000)
</script>
